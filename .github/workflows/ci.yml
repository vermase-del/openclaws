name: CI

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Smoke-test API starter
        run: npm run api:check
