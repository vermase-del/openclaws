name: Frontend CI

on:
  push:
    branches: [main, "feat/**", "integration/**"]
  pull_request:
    branches: [main, "feat/student-hub-foundation"]

permissions:
  contents: read

jobs:
  frontend:
    name: Install and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build frontend
        run: npm run build
